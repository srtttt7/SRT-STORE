name: Build SRTSTORE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
      - name: Ensure SDK Exists
        run: |
          if [ ! -d "$HOME/theos/sdks" ]; then
            git clone https://github.com/theos/sdks.git ~/theos/sdks
          else
            echo "SDKs already exist, skipping clone."
          fi
          
      - name: Build Tweak
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1
          
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SRTSTORE-Package
          path: packages/*.deb
